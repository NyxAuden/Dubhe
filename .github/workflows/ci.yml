name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:17 UTC，错开整点。
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Show toolchain
        run: rustup show
      - name: Install lint components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        # 保留完整测试输出：失败时下载 artifact 能看到具体用例与错误，
        # 不必只凭「Test 步骤失败」去猜。
        # pipefail：否则管道退出码取 tee 的，测试失败会被吞掉。
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-targets --no-fail-fast 2>&1 | tee test-output.log
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.log
          retention-days: 7
      - name: Release build
        run: cargo build --locked --release --bin dubhe

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-deny
        # 必须固定版本：cargo-deny 0.22 要求 rustc 1.95，而本项目固定 1.91.0，
        # 不固定会直接装不上导致 supply-chain job 失败。
        run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: Deny advisories, licenses, sources
        run: cargo deny check

  geo-real:
    name: geo-real
    # 真实地理数据集的兼容性只在 ubuntu 上验一次：数据与平台无关。
    # 不放进三平台矩阵，是因为 34 MB 下载 × 3 既慢又放大网络失败面。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .test-artifacts/geodata
          # 与 tools/fetch_geodata.sh 里钉的版本保持一致；改数据版本时同步改这里。
          key: geodata-202611222203-20261112
      - name: Fetch real geodata
        # 下载失败就让 job 失败：静默跳过等于假装验证过真实数据。
        run: ./tools/fetch_geodata.sh
      - name: Test geodata integration
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --test geo_routing 2>&1 | tee geo-real.log
      - name: Upload geodata test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geo-real-log
          path: geo-real.log
          retention-days: 7

  reproducibility:
    name: reproducibility
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build twice and compare
        run: SOURCE_DATE_EPOCH=1700000000 ./tools/repro-check.sh

  fuzz-smoke:
    name: fuzz-smoke
    # 定时冒烟 + 手动触发；不进 push/PR，避免每次提交都跑十分钟以上。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly
          cargo +nightly install cargo-fuzz --locked
      - name: Smoke fuzz public parsers
        working-directory: fuzz
        run: |
          for target in config vision socks5_datagram http_authority address_read xudp_read vless_datagram trojan_datagram xhttp_head xhttp_uplink grpc_payload vmess_header snell_request snell_udp tuic_wire; do
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -rss_limit_mb=2048
          done

  interop:
    name: interop (${{ matrix.os }})
    # 第三方客户端互通是本项目最核心的声明，必须能被自动复现。
    # 这些用例全部 #[ignore]（要下载数百 MB 官方二进制），因此不进 push/PR：
    # 定时跑一次 + 手动触发。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: interop-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Show toolchain
        run: rustc --version && cargo --version
      # 下载脚本会校验上游 release 资产摘要、二进制平台与 `version` 输出；
      # 任何一步失败都让 job 失败，不静默跳过。
      - name: Fetch pinned reference clients
        run: python3 -I tools/fetch_reference_clients.py
      - name: Run interop suite
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --test reference_clients -- --ignored --test-threads=1 2>&1 | tee interop.log
      - name: Upload interop log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interop-log-${{ matrix.os }}
          path: interop.log
