name: release

on:
  push:
    tags:
      - "v*"
  # 手动触发的唯一用途是「演练打包链路」：只构建并上传 artifact，
  # **不发布**（`publish` job 有条件跳过）。第一次发版前应该先跑它，
  # 下载三个平台的包、解包、校验、实际运行一次。
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
          - os: ubuntu-24.04-arm
            asset: linux-aarch64
          - os: macos-15
            asset: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - name: Build
        run: cargo build --locked --release --bin dubhe

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # 手动触发时没有 tag，用 `Cargo.toml` 的版本并标注 -dispatch，
          # 避免把演练产物误认成正式版本。
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dispatch"
          fi
          name="dubhe-${version}-${{ matrix.asset }}"
          mkdir -p "$name/systemd" "$name/examples" "$name/licenses"
          cp target/release/dubhe "$name/"
          # NOTICE 的「分发义务」要求随二进制附带 NOTICE 本身与 vendor/ 下
          # 各组件的原始许可文本；此前只复制 LICENSE/THIRD-PARTY/README，
          # 不满足该义务。
          cp LICENSE NOTICE THIRD-PARTY.md README.md "$name/"
          cp packaging/systemd/dubhe.service "$name/systemd/"
          # 随包放一个只监听回环的示例：README 的快速开始引用了它，
          # 缺了它会让解包后的 `check` 直接失败。
          cp examples/socks5.json "$name/examples/"
          # 保留 vendor 目录结构，避免不同组件的同名许可互相覆盖。
          for dir in vendor/*/; do
            component="$(basename "$dir")"
            for file in "$dir"LICENSE* "$dir"COPYING*; do
              [ -f "$file" ] || continue
              cp "$file" "$name/licenses/${component}-$(basename "$file")"
            done
          done
          # 二进制自报版本取自 Cargo.toml；tag 与它不一致会让用户拿到
          # 「包名 v0.2.0、程序自称 0.1.0」的产物。发版时强制对齐。
          if [ "${{ github.event_name }}" = "push" ]; then
            crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            if [ "$crate_version" != "$version" ]; then
              echo "::error::tag 版本 ${version} 与 Cargo.toml 的 ${crate_version} 不一致" >&2
              exit 1
            fi
          fi
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          "$name/dubhe" version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dubhe-*.tar.gz
            dubhe-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    # 手动触发只演练打包，绝不发布；发布只由 tag 驱动。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -l artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
