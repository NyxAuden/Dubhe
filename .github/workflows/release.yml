name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
          - os: ubuntu-24.04-arm
            asset: linux-aarch64
          - os: macos-15
            asset: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - name: Build
        run: cargo build --locked --release --bin dubhe

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="dubhe-${version}-${{ matrix.asset }}"
          mkdir -p "$name/systemd" "$name/examples" "$name/licenses"
          cp target/release/dubhe "$name/"
          # NOTICE 的「分发义务」要求随二进制附带 NOTICE 本身与 vendor/ 下
          # 各组件的原始许可文本；此前只复制 LICENSE/THIRD-PARTY/README，
          # 不满足该义务。
          cp LICENSE NOTICE THIRD-PARTY.md README.md "$name/"
          cp packaging/systemd/dubhe.service "$name/systemd/"
          # 随包放一个只监听回环的示例：README 的快速开始引用了它，
          # 缺了它会让解包后的 `check` 直接失败。
          cp examples/socks5.json "$name/examples/"
          # 保留 vendor 目录结构，避免不同组件的同名许可互相覆盖。
          for dir in vendor/*/; do
            component="$(basename "$dir")"
            for file in "$dir"LICENSE* "$dir"COPYING*; do
              [ -f "$file" ] || continue
              cp "$file" "$name/licenses/${component}-$(basename "$file")"
            done
          done
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          "$name/dubhe" version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dubhe-*.tar.gz
            dubhe-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -l artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
