name: release

on:
  push:
    tags:
      - "v*"
  # 手动触发的唯一用途是「演练打包链路」：只构建并上传 artifact，
  # **不发布**（`publish` job 有条件跳过）。第一次发版前应该先跑它，
  # 下载三个平台的包、解包、校验、实际运行一次。
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 交付静态 musl：目标环境是 Debian 11 这类老 glibc 系统，
          # 静态 ELF 不依赖宿主 libc 版本。资产名标注 libc，避免与 GNU 包混淆。
          - os: ubuntu-24.04
            asset: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
          # ARM64 Linux 暂保留宿主 GNU 构建；其运行基线与验证状态单列，
          # 不因共享 `linux-` 前缀而享有 x86_64 的验收结果。
          - os: ubuntu-24.04-arm
            asset: linux-aarch64-gnu
            target: ""
          - os: macos-15
            asset: darwin-arm64
            target: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      # musl 目标的 C 依赖（aws-lc-rs、ring、blake3 等）要走 musl-gcc，
      # 只加 Rust 标准库不够：这些 crate 自带 C/汇编实现，需要对应的 C 工具链。
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          musl-gcc --version | head -1

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            export CC_x86_64_unknown_linux_musl=musl-gcc
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            cargo build --locked --release --bin dubhe --target "$TARGET"
          else
            cargo build --locked --release --bin dubhe
          fi

      # 解包后必须能从 ELF 属性上确认「这就是静态 musl」，而不是误打包了
      # 宿主 GNU 二进制。构建路径与打包路径同时受 target 影响，两者要一起改。
      - name: Verify ELF
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            bin="target/${TARGET}/release/dubhe"
          else
            bin="target/release/dubhe"
          fi
          echo "BIN=$bin" >> "$GITHUB_ENV"
          file "$bin"
          if [ "${{ matrix.asset }}" = "linux-x86_64-musl" ]; then
            # 静态 ELF 不应有 PT_INTERP 与 DT_NEEDED；有则说明链接成了动态。
            if readelf -lW "$bin" | grep -q 'INTERP'; then
              echo "::error::musl 工件含 PT_INTERP，不是静态链接" >&2
              exit 1
            fi
            if readelf -dW "$bin" | grep -q 'NEEDED'; then
              echo "::error::musl 工件含 DT_NEEDED，不是静态链接" >&2
              exit 1
            fi
            echo "已确认：x86_64 静态 ELF，无 PT_INTERP / DT_NEEDED"
          fi
          sha256sum "$bin" | tee "$RUNNER_TEMP/bin.sha256" || shasum -a 256 "$bin"
          echo "BIN_SHA=$(cut -d' ' -f1 "$RUNNER_TEMP/bin.sha256")" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # 手动触发时没有 tag，用 `Cargo.toml` 的版本并标注 -dispatch，
          # 避免把演练产物误认成正式版本。
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dispatch"
          fi
          name="dubhe-${version}-${{ matrix.asset }}"
          mkdir -p "$name/systemd" "$name/examples" "$name/licenses"
          # 打包路径必须与构建 target 一致，否则会把宿主默认目标的二进制
          # 打进包里（x86_64 上就是 GNU 动态链接）。
          cp "$BIN" "$name/"
          # 记录包内二进制的 SHA，便于把「验收结果」绑定到具体 ELF，
          # 而不是绑定到包名。
          printf '%s  dubhe\n' "$BIN_SHA" > "$name/dubhe.sha256"
          echo "包内二进制 SHA-256: $BIN_SHA"
          # NOTICE 的「分发义务」要求随二进制附带 NOTICE 本身与 vendor/ 下
          # 各组件的原始许可文本；此前只复制 LICENSE/THIRD-PARTY/README，
          # 不满足该义务。
          cp LICENSE NOTICE THIRD-PARTY.md README.md "$name/"
          cp packaging/systemd/dubhe.service "$name/systemd/"
          # 随包放一个只监听回环的示例：README 的快速开始引用了它，
          # 缺了它会让解包后的 `check` 直接失败。
          cp examples/socks5.json "$name/examples/"
          # 保留 vendor 目录结构，避免不同组件的同名许可互相覆盖。
          for dir in vendor/*/; do
            component="$(basename "$dir")"
            for file in "$dir"LICENSE* "$dir"COPYING*; do
              [ -f "$file" ] || continue
              cp "$file" "$name/licenses/${component}-$(basename "$file")"
            done
          done
          # 二进制自报版本取自 Cargo.toml；tag 与它不一致会让用户拿到
          # 「包名 v0.2.0、程序自称 0.1.0」的产物。发版时强制对齐。
          if [ "${{ github.event_name }}" = "push" ]; then
            crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            if [ "$crate_version" != "$version" ]; then
              echo "::error::tag 版本 ${version} 与 Cargo.toml 的 ${crate_version} 不一致" >&2
              exit 1
            fi
          fi
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          "$name/dubhe" version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dubhe-*.tar.gz
            dubhe-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    # 手动触发只演练打包，绝不发布；发布只由 tag 驱动。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -l artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
