name: Feature request
description: 提议新能力或配置项
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新协议或配置 schema 变更请先在这个 issue 里讨论，不要直接开 PR。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在卡在哪里，不要直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 上游依据
      description: 如果是协议能力，给出上游仓库版本、文件、行号或规范链接
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: 影响面
      options:
        - 仅新增可选字段
        - 新增协议或传输
        - 改变现有配置语义
        - 不确定
    validations:
      required: true
