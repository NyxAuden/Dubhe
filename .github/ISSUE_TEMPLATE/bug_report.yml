name: Bug report
description: 报告可复现的缺陷
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全问题请走 [SECURITY.md](../../blob/main/SECURITY.md) 的私密渠道，不要开公开 issue。

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: `dubhe version` 的输出，或 git commit
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 平台
      options:
        - Linux x86_64
        - Linux ARM64
        - macOS ARM64
        - 其他（在描述里写明）
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: 客户端与版本
      description: 例如 sing-box v1.14.4、Mihomo v1.19.33、Xray v26.10.31
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 最小配置
      description: 去掉凭据后的完整 inbound/outbound/route 片段
      render: json
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动到出问题的每一步
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 只贴脱敏后的 JSON 日志，不要贴 token、私钥、业务载荷
      render: text
    validations:
      required: false
