# cargo-deny 门禁。首次运行前请安装：
#   cargo install cargo-deny --locked
# 运行：
#   cargo deny check
#
# 允许列表按当前 Cargo.lock 的实际许可证收敛；新增依赖若引入未列出的
# 许可证，门禁必须失败，而不是静默放行。GPL-3.0-only 仅用于本项目与
# vendored Nowhere；其余依赖必须保持与 GPL-3.0-only 分发兼容。

[advisories]
version = 2
yanked = "deny"
# 每条 ignore 都必须写明为何本仓库不受影响，不接受「先放行再说」。
ignore = [
    # humantime 2.4.0 的实际依赖为空（`cargo tree -i humantime` 只显示
    # nowhere -> dubhe），公告正文「humantime wraps chrono」的前提对本版本
    # 不成立。chrono 已从依赖树移除；humantime 仅用于解析 NOW_* 环境变量的
    # 时长（5m / 1h30m / 2 days / 1min 30sec），无替代品且无自写解析器的
    # 风险收益比。上游 nowhere 引入，见 docs/upstream-facts.md。
    "RUSTSEC-2026-0542",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# vendored/path 依赖（rustls、shadowsocks、blake3、h3、nowhere 等）没有版本号，
# 但来源由 Cargo.toml 的 path 与固定源码控制；只对本项目允许这种形式。
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
